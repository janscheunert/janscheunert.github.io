       LIGHTBOX
  ═══════════════════════════════════════════ -->
  <div class="lightbox" id="lightbox" aria-modal="true" role="dialog" aria-label="Photo viewer" aria-hidden="true">
    <div class="lightbox-backdrop" id="lightboxBackdrop"></div>
    <div class="lightbox-content">
      <button class="lightbox-close" id="lightboxClose" aria-label="Close">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <button class="lightbox-arrow lightbox-prev" id="lightboxPrev" aria-label="Previous photo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="lightbox-img-wrap">
        <img src="" alt="" id="lightboxImg" />
      </div>
      <button class="lightbox-arrow lightbox-next" id="lightboxNext" aria-label="Next photo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
      <div class="lightbox-counter" id="lightboxCounter">1 / 12</div>
    </div>
