        <div class="page-col page-col--wide">
          <p class="contact-intro">For editorial commissions, licensing, and commercial enquiries or write directly to
          <a href="mailto:info@janscheunert.de">info@janscheunert.de</a>.</p>

          <!-- Web3Forms: replace YOUR_ACCESS_KEY with key from web3forms.com (free) -->
          <form class="contact-form" id="contactForm"
                action="https://api.web3forms.com/submit"
                method="POST"
                novalidate>

            <input type="hidden" name="access_key" value="f2c09a72-8455-40e0-b9e2-76c9c3263367" />
            <input type="hidden" name="subject"    value="New enquiry via janScheunert.com" />
            <input type="hidden" name="from_name"  value="Jan Scheunert Website" />
            <!-- Honeypot anti-spam -->
            <input type="checkbox" name="botcheck" style="display:none" tabindex="-1" aria-hidden="true" />

            <div class="form-row">
              <label class="form-label" for="cf-name">Name</label>
              <input class="form-input" type="text" id="cf-name" name="name"
                     autocomplete="name" placeholder="Your full name" required />
            </div>

            <div class="form-row">
              <label class="form-label" for="cf-email">Email</label>
              <input class="form-input" type="email" id="cf-email" name="email"
                     autocomplete="email" placeholder="your@email.com" required />
            </div>

            <div class="form-row">
              <label class="form-label" for="cf-subject">Subject</label>
              <input class="form-input" type="text" id="cf-subject" name="subject_line"
                     placeholder="Editorial · Commercial · Licensing · Other" />
            </div>

            <div class="form-row">
              <label class="form-label" for="cf-message">Message</label>
              <textarea class="form-input form-textarea" id="cf-message" name="message"
                        rows="6" placeholder="Tell me about your project." required></textarea>
            </div>

            <div class="form-row form-row--submit">
              <button type="submit" class="form-submit" id="formSubmit">Send message</button>
              <p class="form-status" id="formStatus" aria-live="polite"></p>
            </div>
          </form>
        </div>
      </div>

  <script>
  (function () {
    const form   = document.getElementById('contactForm');
    const btn    = document.getElementById('formSubmit');
    const status = document.getElementById('formStatus');
    if (!form) return;

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled    = true;
      btn.textContent = 'Sending…';
      status.textContent = '';
      status.className   = 'form-status';

      try {
        const res  = await fetch(form.action, {
          method: 'POST',
          body:   new FormData(form),
          headers: { Accept: 'application/json' }
        });
        const data = await res.json();

        if (data.success) {
          status.textContent = 'Message sent — thank you.';
          status.classList.add('success');
          form.reset();
        } else {
          throw new Error(data.message || 'Unknown error');
        }
      } catch (err) {
        status.textContent = 'Something went wrong. Please email directly.';
        status.classList.add('error');
      } finally {
        btn.disabled    = false;
        btn.textContent = 'Send message';
      }
    });
  })();
  </script>
